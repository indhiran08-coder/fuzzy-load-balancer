# =============================================================================
# application.properties — Base/Default Configuration
#
# Spring Boot reads this file on startup. Profile-specific files
# (application-dev.properties, application-prod.properties) override values
# defined here when that profile is active.
#
# Activate a profile with:
#   --spring.profiles.active=dev       (local development)
#   --spring.profiles.active=prod      (production)
# =============================================================================

# -----------------------------------------------------------------------------
# APPLICATION IDENTITY
# -----------------------------------------------------------------------------
spring.application.name=Fuzzy Load Balancer
server.port=8080

# Servlet context path — all endpoints will be prefixed with /api
# e.g., /api/auth/login, /api/servers, etc.
server.servlet.context-path=/

# -----------------------------------------------------------------------------
# DATABASE — MySQL (override in profile files)
# -----------------------------------------------------------------------------
# JDBC URL — connects to MySQL database named 'fuzzy_lb'
# createDatabaseIfNotExist=true creates the DB schema automatically
spring.datasource.url=jdbc:mysql://localhost:3306/fuzzy_lb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (Spring Boot default pool)
# Maximum 10 simultaneous DB connections in the pool
spring.datasource.hikari.maximum-pool-size=10
# Connections idle for >600 seconds are closed
spring.datasource.hikari.idle-timeout=600000
# Pool name visible in monitoring/actuator
spring.datasource.hikari.pool-name=FuzzyLBPool

# -----------------------------------------------------------------------------
# JPA / HIBERNATE
# -----------------------------------------------------------------------------
# DDL auto — 'update' creates/updates tables based on entity classes.
# DO NOT use 'create-drop' in production (destroys data on restart).
# Options: none | validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console — useful for debugging, disable in prod
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect — tells Hibernate which SQL dialect to generate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Batch inserts for better bulk-write performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# -----------------------------------------------------------------------------
# SPRING SECURITY
# -----------------------------------------------------------------------------
# Disable the default generated security password (we use JWT)
spring.security.user.name=admin
spring.security.user.password=admin

# -----------------------------------------------------------------------------
# JWT CONFIGURATION
# -----------------------------------------------------------------------------
# Secret key used to sign JWT tokens (HS256 algorithm).
# IMPORTANT: In production, use a strong 256-bit key and store in env variable.
app.jwt.secret=fuzzyLoadBalancerSecretKey2024ThisKeyMustBe256BitsLongForHS256Security
# Token expiration: 24 hours in milliseconds (86400000 ms)
app.jwt.expiration=86400000
# Refresh token expiration: 7 days
app.jwt.refresh-expiration=604800000

# -----------------------------------------------------------------------------
# THYMELEAF
# -----------------------------------------------------------------------------
# Cache disabled during development — templates are re-read on each request
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# -----------------------------------------------------------------------------
# SPRINGDOC / SWAGGER
# -----------------------------------------------------------------------------
# Swagger UI is accessible at: http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Allow Swagger UI to send JWT tokens for testing secured endpoints
springdoc.swagger-ui.try-it-out-enabled=true

# -----------------------------------------------------------------------------
# ACTUATOR
# -----------------------------------------------------------------------------
# Expose health and info endpoints (restrict in production)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# -----------------------------------------------------------------------------
# SIMULATION MODULE
# -----------------------------------------------------------------------------
# How often (ms) the auto-simulation scheduler updates server metrics
app.simulation.interval-ms=5000
# Whether auto-simulation starts on application startup
app.simulation.auto-start=false

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging.level.com.fuzzybalancer=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
