# =============================================================================
# application-test.properties — Test Profile Configuration
#
# Active when: @ActiveProfiles("test") is set on the test class
#
# Uses H2 in-memory database instead of MySQL.
# This means tests:
#   1. Never touch your development MySQL database
#   2. Start with a clean DB every test run
#   3. Run without MySQL installed at all
#   4. Run in CI/CD pipelines without external dependencies
# =============================================================================

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 console (useful for debugging tests)
spring.h2.console.enabled=true

# JPA — create-drop: create schema on startup, drop on shutdown
# Perfect for integration tests (clean state every run)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable Thymeleaf cache for test speed
spring.thymeleaf.cache=false

# Disable simulation auto-start during tests
app.simulation.auto-start=false
app.simulation.interval-ms=999999

# Suppress most logging during tests (only errors + warns)
logging.level.com.fuzzybalancer=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
